      .kw { fill: #c58cff; }
      .ty { fill: #8fd3ff; }
      .cm { fill: #6e5a85; font-style: italic; }
    </style>
  </defs>

  <!-- flat background -->
  <rect width="1200" height="420" rx="24" fill="#1d1229"/>

