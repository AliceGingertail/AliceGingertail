  <rect x="344" y="216" width="50" height="86" rx="20" fill="#1d1229"/>
  <circle cx="171" cy="259" r="11" fill="none" stroke="#c58cff" stroke-width="3"/>
  <circle cx="369" cy="259" r="11" fill="none" stroke="#c58cff" stroke-width="3"/>
